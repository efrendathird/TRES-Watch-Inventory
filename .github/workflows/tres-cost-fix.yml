name: Fix TRES Cost History

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject cost fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '__tresCostFix' in s:
              raise SystemExit(0)
          js=Path('tres-cost-fix.js').read_text(encoding='utf-8')
          s=s.replace('</body>', '<script id="tres-cost-fix-v1">'+js+'</script></body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore watch cost summary and editing'
          git push