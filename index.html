<html lang="en">

<style>
:root{--bg:#f3f0ea;--card:#fffdf9;--surface:#f8f5ef;--ink:#28251f;--muted:#8a8379;--line:#e1dbd1;--espresso:#25221e;--espresso2:#332e28;--brass:#a48a65;--green:#58725e;--red:#a15c56;--shadow:0 8px 28px rgba(50,42,32,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:236px;background:var(--espresso);color:#f8f4ed;padding:20px 14px 16px;z-index:30;transition:width .2s;display:flex;flex-direction:column}.app.collapsed .sidebar{width:70px}.main{margin-left:236px;padding:30px 38px 60px;transition:margin-left .2s;max-width:1650px}.app.collapsed .main{margin-left:70px}
.sidebar-head{padding:4px 10px 18px;border-bottom:1px solid #3b3630}.brand{font-size:27px;font-weight:800;letter-spacing:.25em;margin:0}.subbrand{font-size:9px;color:#918a80;letter-spacing:.2em;margin-top:3px}.navlabel{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#756e65;margin:20px 12px 7px}.nav{width:100%;border:0;background:transparent;color:#aaa198;text-align:left;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;margin:2px 0}.nav:hover,.nav.active{background:#39342e;color:#fff}.icon{width:18px;text-align:center;flex:0 0 18px}.sidebar-nav{flex:1}.collapse{position:absolute;top:18px;right:14px;margin:0;width:34px;height:34px;border:1px solid #4a443e;background:#302c28;color:#fff;border-radius:8px}.app.collapsed .sidebar-head{padding:28px 0 20px;border-bottom-color:transparent}.app.collapsed .brand,.app.collapsed .subbrand,.app.collapsed .navlabel,.app.collapsed .navtext{display:none}.app.collapsed .sidebar-nav{padding-top:22px}.app.collapsed .nav{justify-content:center;padding-left:0;padding-right:0}.app.collapsed .nav:first-of-type{margin-top:8px}.app.collapsed .icon{width:20px;flex-basis:20px}.app.collapsed .collapse{width:34px;right:18px;top:18px}
.pagehead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:21px}.pagehead h1{margin:0;font-size:29px;letter-spacing:-.04em}.pagehead p{margin:5px 0 0;color:var(--muted)}
.btn{border:1px solid #d7cfc3;background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:650}.btn.primary{background:var(--espresso);color:#fff;border-color:var(--espresso)}.btn.ghost{background:transparent}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:17px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.kpi small{display:block;color:#938b80;text-transform:uppercase;letter-spacing:.1em;font-size:9px}.kpi strong{font-size:23px;display:block;margin-top:4px}.good{color:var(--green)}.bad{color:var(--red)}
.search{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:4px 13px;margin-bottom:20px}.search input{width:100%;border:0;outline:0;background:transparent;padding:12px 2px;color:var(--ink);font-size:15px}
.watchgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.watch{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}.watch:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(50,42,32,.09)}.photo{aspect-ratio:1;background:#e9e4dc;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.status{position:absolute;top:8px;right:8px;background:rgba(255,253,249,.95);border:1px solid #ded5c9;padding:4px 8px;border-radius:99px;font-size:9px;font-weight:750;text-transform:uppercase}.title{font-weight:750;margin-top:11px}.meta{font-size:12px;color:var(--muted);margin-top:2px}.moneyrow{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:9px}.moneyrow small{display:block;color:#938b80;text-transform:uppercase;font-size:9px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.filterbar{display:flex;gap:8px;flex-wrap:wrap}.filterbar input,.filterbar select{border:1px solid #d7cfc3;border-radius:10px;padding:10px;background:#fffdf9;color:var(--ink)}.tablewrap{overflow:auto}.table{width:100%;min-width:760px;border-collapse:collapse}.table th{padding:11px;color:#91897e;text-align:left;text-transform:uppercase;letter-spacing:.08em;font-size:9px;border-bottom:1px solid var(--line)}.table td{padding:12px 11px;border-bottom:1px solid var(--line)}.table .amount{text-align:right;font-variant-numeric:tabular-nums}.panel h3{margin:0 0 12px;font-size:15px}.click:hover{background:#faf7f1;cursor:pointer}
.profile-shell{display:grid;grid-template-columns:minmax(380px,1fr) minmax(430px,1fr);gap:22px}.profile-photo{aspect-ratio:1;background:#e9e4dc;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center}.profile-photo img{width:100%;height:100%;object-fit:contain}.profile-title{font-size:31px;letter-spacing:-.04em;line-height:1.1}.profile-meta{color:var(--muted);margin-top:4px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{background:var(--surface);padding:13px;border-radius:12px}.metric small{display:block;color:#8c8479;text-transform:uppercase;font-size:9px}.metric b{font-size:18px;display:block;margin-top:3px}.rows .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.rows .row span{color:var(--muted)}
.cost-list{display:grid;gap:0}.cost-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:22px;padding:11px 0;border-bottom:1px solid var(--line)}.cost-item span{color:#645d54}.cost-item b{font-variant-numeric:tabular-nums;white-space:nowrap}.cost-total{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:22px;padding-top:15px;margin-top:3px;font-weight:750}.history-list{display:grid;gap:0}.history-item{display:grid;grid-template-columns:108px minmax(120px,170px) 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border-bottom:0}.history-date{color:var(--muted);font-size:12px;white-space:nowrap}.history-type{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.history-detail{color:#6d665d;font-size:12px;min-width:0}.history-amount{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}.spend-shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.funding-summary{display:flex;gap:24px;flex-wrap:wrap;padding:10px 0 14px}.funding-summary span{color:var(--muted)}.funding-summary b{margin-left:6px}.spend-shortcut{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 19px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:18px}.spend-shortcut .eyebrow{margin-bottom:4px}.spend-shortcut h3{margin:0;font-size:16px}.spend-shortcut p{margin:4px 0 0;color:var(--muted);font-size:12px}.spend-shortcut .btn{flex:0 0 auto}@media(max-width:950px){.history-item{grid-template-columns:90px 1fr auto}.history-detail{grid-column:2/3}.spend-shortcuts{grid-template-columns:1fr}}.sectionbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.analytics-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.chart{height:250px;display:flex;align-items:flex-end;gap:7px;border-bottom:1px solid var(--line);padding:0 4px 22px}.bar{flex:1;background:var(--brass);border-radius:5px 5px 0 0;min-width:6px;position:relative}.bar label{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:9px;color:#90887d}.stack{display:grid;gap:14px}.totalbox{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center}.totalbox small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:9px}.totalbox b{font-size:19px}
.modalbg{display:none;position:fixed;inset:0;background:rgba(25,22,19,.42);z-index:100;align-items:center;justify-content:center;padding:20px}.modal{width:min(720px,calc(100vw - 30px));max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;box-shadow:0 25px 90px rgba(0,0,0,.2)}.modalhead{padding:15px 24px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modalbody{padding:18px 24px}.modalfoot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d7cfc3;border-radius:10px;padding:10px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.notice{padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:11px;color:#6e675e;font-size:12px}.empty{text-align:center;color:#918a7f;padding:40px}
.sectionline{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.sectionline h3{margin:0;font-size:15px}.sectionline .btn{border:0;background:transparent;padding:5px 0;color:#6f675d}.sectionline .btn:hover{text-decoration:underline;background:transparent}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.spending-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#91897e}.mobilebar,.mobile-overlay{display:none}
@media(max-width:1100px){.watchgrid{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}.profile-shell{grid-template-columns:1fr}.analytics-grid{grid-template-columns:1fr}.spending-grid{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.sidebar{transform:translateX(-100%);width:260px;transition:transform .22s}.app.mobile-open .sidebar{transform:translateX(0)}.app.collapsed .sidebar{width:260px}.app.collapsed .main{margin-left:0}.main{margin-left:0;padding:74px 14px 40px}.mobilebar{display:flex;position:fixed;top:0;left:0;right:0;height:58px;background:var(--espresso);color:#fff;z-index:25;align-items:center;justify-content:space-between;padding:0 14px}.mobilebar b{letter-spacing:.2em}.mobilebar button{border:1px solid #4a443e;background:#302c28;color:#fff;border-radius:8px;width:36px;height:36px}.mobile-overlay{position:fixed;inset:0;background:rgba(25,22,19,.4);z-index:29}.app.mobile-open .mobile-overlay{display:block}.collapse{display:none}.watchgrid{grid-template-columns:repeat(2,1fr);gap:10px}.kpis{grid-template-columns:repeat(2,1fr)}.pagehead{flex-direction:column}.grid3,.spending-grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.profile-title{font-size:25px}.history-item{grid-template-columns:80px 1fr}.history-amount{grid-column:2}.search{margin-bottom:14px}.table{min-width:680px}}
@media(max-width:420px){.watchgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.kpi strong{font-size:21px}}
</style>
</head>
<body>
<div id="app" class="app">
  <div class="mobilebar"><b>TRES</b><button id="mobileMenu" aria-expanded="false">☰</button></div>
  <div class="mobile-overlay" id="mobileOverlay"></div>
  <aside class="sidebar">
    <div class="sidebar-head"><div class="brand">TRES</div><div class="subbrand desktop-subbrand">WATCH INVENTORY</div></div>
    <button class="collapse" id="collapse">‹</button>
    <div class="sidebar-nav">
      <div class="navlabel">Workspace</div>
      <button class="nav active" data-view="overview"><span class="icon">⌂</span><span class="navtext">Overview</span></button>
      <button class="nav" data-view="inventory"><span class="icon">◫</span><span class="navtext">Inventory</span></button>
      <button class="nav" data-view="transactions"><span class="icon">↔</span><span class="navtext">Transactions</span></button>
      <button class="nav" data-view="analytics"><span class="icon">◒</span><span class="navtext">Analytics</span></button>
      <button class="nav" data-view="reports"><span class="icon">▤</span><span class="navtext">Reports</span></button>
    </div>
  </aside>
  <main class="main" id="content"></main>
</div>
<div id="modalbg" class="modalbg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qkwhinlgeeazujzhimkc.supabase.co";
const SUPABASE_KEY="sb_publishable_1DNsAVSblA5RRcCYyXcw5w_7hmnFN34";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let db={watches:[],opex:[],capex:[],otherCosts:[],funding:[],settings:{openingFunds:0}};
let current="overview",currentWatch=null,inventoryPage=1;
const inventorySort={key:"purchase",dir:"desc"},txSort={key:"date",dir:"desc"},opexSort={key:"date",dir:"desc"},capexSort={key:"date",dir:"desc"},otherSort={key:"date",dir:"desc"};
const money=n=>"₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-US"):"—";
function normalizeDb(x){x=x||{};return{watches:Array.isArray(x.watches)?x.watches:[],opex:Array.isArray(x.opex)?x.opex:[],capex:Array.isArray(x.capex)?x.capex:[],otherCosts:Array.isArray(x.otherCosts)?x.otherCosts:[],funding:Array.isArray(x.funding)?x.funding:[],settings:{openingFunds:Number(x.settings?.openingFunds||0)}}}
async function save(){
  db=normalizeDb(db);
  localStorage.setItem("tres_db_v1",JSON.stringify(db));
  const {error}=await supabaseClient.from("app_state").upsert({id:"tres",data:db,updated_at:new Date().toISOString()},{onConflict:"id"});
  if(error){console.error(error);toast("Saved locally, but database sync failed.");throw error}
}
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;right:18px;bottom:18px;z-index:999;padding:12px 15px;background:#25221e;color:#fff;border-radius:10px;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.2)";document.body.appendChild(t)}t.textContent=msg;t.style.opacity="1";clearTimeout(t._x);t._x=setTimeout(()=>t.style.opacity="0",2400)}
function st(w){return w.status||"available"}
function costsFor(id){return db.watches.find(w=>w.id===id)?.costs||[]}
function costTo(w){return Number((w?.costs||[]).reduce((a,c)=>a+Number(c.amount||0),0))}
function realized(w){const tx=(w?.transactions||[]).find(t=>t.status==="completed");return tx?Number(tx.amount||0)-costTo(w):0}
function potential(w){return Number(w.asking||0)-costTo(w)}
function search(q){q=String(q||"").toLowerCase();return db.watches.filter(w=>[w.id,w.title,w.brand,w.model,w.ref,w.year,w.status].join(" ").toLowerCase().includes(q))}
function txRows(){return db.watches.flatMap(w=>(w.transactions||[]).map(t=>({id:w.id,date:t.date,type:t.type,amount:Number(t.amount||0),pl:Number(t.amount||0)-costTo(w),status:t.status,detail:t.counterparty||t.notes||""}))).sort((a,b)=>b.date.localeCompare(a.date))}
function view(name,html){document.getElementById("content").innerHTML=html}
function render(){document.querySelectorAll(".nav[data-view]").forEach(n=>n.classList.toggle("active",n.dataset.view===current));if(current==="overview")renderOverview();else if(current==="inventory")renderInventory();else if(current==="transactions")renderTransactions();else if(current==="analytics")renderAnalytics();else if(current==="reports")renderReports();else if(current==="profile")renderProfile();}
function header(title,sub,actions=""){return `<div class="pagehead"><div><h1>${esc(title)}</h1><p>${esc(sub||"")}</p></div><div>${actions}</div></div>`}
function card(w){return `<div class="watch" data-action="open-watch" data-id="${esc(w.id)}"><div class="photo">${w.photo?`<img src="${esc(w.photo)}">`:`<span style="color:#a49b90;font-size:12px">WATCH</span>`}<span class="status">${esc(st(w))}</span></div><div class="title">${esc(w.brand||"")} ${esc(w.model||w.title||"")}</div><div class="meta">Ref. ${esc(w.ref||"—")} &nbsp; Year ${esc(w.year||"—")}</div><div class="moneyrow"><div><small>Cost</small><b>${money(costTo(w))}</b></div><div style="text-align:right"><small>Asking</small><b>${money(w.asking)}</b></div></div></div>`}
function renderOverview(){const av=db.watches.filter(w=>st(w)==="available"),inv=av.reduce((a,w)=>a+costTo(w),0),rev=txRows().filter(x=>x.status==="completed").reduce((a,x)=>a+x.amount,0),pl=txRows().filter(x=>x.status==="completed").reduce((a,x)=>a+x.pl,0);view("overview",header("Overview","A clean view of the current watch book.",`<button class="btn primary" data-action="add-watch">+ Add watch</button>`)+`<div class="kpis"><div class="kpi"><small>Available watches</small><strong>${av.length}</strong></div><div class="kpi"><small>Inventory at cost</small><strong>${money(inv)}</strong></div><div class="kpi"><small>Sales</small><strong>${money(rev)}</strong></div><div class="kpi"><small>Realized P/L</small><strong class="${pl>=0?'good':'bad'}">${money(pl)}</strong></div><div class="kpi"><small>Available funds</small><strong>${money(availableFunds())}</strong></div></div><div class="search"><input id="homeSearch" placeholder="Search available watches by ID, brand, model, reference..." autocomplete="off"></div><div id="homeResults" class="watchgrid">${av.slice(0,8).map(card).join("")||'<div class="panel empty" style="grid-column:1/-1">No watches yet. Add your first watch to begin.</div>'}</div>`)}
function renderInventory(){const brands=[...new Set(db.watches.map(w=>w.brand).filter(Boolean))].sort();view("inventory",header("Inventory","Search-first inventory. Available watches are shown by default.",`<button class="btn primary" data-action="add-watch">+ Add watch</button>`)+`<div class="panel"><div class="filterbar"><input id="invSearch" placeholder="Search watch ID, brand, model, ref..." style="flex:1;min-width:220px"><select id="invStatus"><option value="available">Available</option><option value="all">All statuses</option><option value="sold">Sold</option><option value="traded">Traded</option></select><select id="invBrand"><option value="">All brands</option>${brands.map(b=>`<option>${esc(b)}</option>`).join("")}</select></div><div id="inventoryTable" style="margin-top:14px"></div></div>`);filterInventory()}
function filterInventory(){const q=(document.getElementById("invSearch")?.value||"").toLowerCase(),status=document.getElementById("invStatus")?.value||"available",brand=document.getElementById("invBrand")?.value||"";let rows=db.watches.filter(w=>(status==="all"||st(w)===status)&&(!brand||w.brand===brand)&&([w.id,w.brand,w.model,w.title,w.ref,w.year].join(" ").toLowerCase().includes(q)));rows.sort((a,b)=>{let k=inventorySort.key,va=k==="purchase"?(a.purchase||""):String(a[k]||"").toLowerCase(),vb=k==="purchase"?(b.purchase||""):String(b[k]||"").toLowerCase();return (va>vb?1:va<vb?-1:0)*(inventorySort.dir==="desc"?-1:1)});const pages=Math.max(1,Math.ceil(rows.length/20));inventoryPage=Math.min(inventoryPage,pages);const pageRows=rows.slice((inventoryPage-1)*20,inventoryPage*20);const el=document.getElementById("inventoryTable");if(!el)return;el.innerHTML=pageRows.length?`<div class="tablewrap"><table class="table"><thead><tr><th data-inv-sort="id">Watch</th><th data-inv-sort="purchase">Acquired</th><th data-inv-sort="status">Status</th><th>Cost</th><th>Asking</th><th>Potential P/L</th><th></th></tr></thead><tbody>${pageRows.map(w=>`<tr class="click" data-action="open-watch" data-id="${esc(w.id)}"><td><b>${esc(w.brand||"")} ${esc(w.model||w.title||"")}</b><div style="font-size:12px;color:var(--muted)">Ref. ${esc(w.ref||"—")} &nbsp; Year ${esc(w.year||"—")}</div></td><td>${fmtDate(w.purchase)}</td><td>${esc(st(w))}</td><td class="amount">${money(costTo(w))}</td><td class="amount">${money(w.asking)}</td><td class="amount ${potential(w)>=0?'good':'bad'}">${money(potential(w))}</td><td style="text-align:right">›</td></tr>`).join("")}</tbody></table></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:12px"><span>Showing ${(inventoryPage-1)*20+1}–${Math.min(inventoryPage*20,rows.length)} of ${rows.length}</span><div><button class="btn" data-inv-page="${inventoryPage-1}" ${inventoryPage<=1?'disabled':''}>Prev</button> <button class="btn" data-inv-page="${inventoryPage+1}" ${inventoryPage>=pages?'disabled':''}>Next</button></div></div>`:'<div class="empty">No watches match the current filters.</div>'}
function renderProfile(){const w=db.watches.find(x=>x.id===currentWatch);if(!w){current="inventory";return render()}const tx=w.transactions||[];view("profile",header("Watch Profile","Every cost and transaction follows the permanent Watch ID.",`<button class="btn" data-action="back-inventory">← Inventory</button>`)+`<div class="profile-shell"><div class="panel"><div class="profile-photo">${w.photo?`<img src="${esc(w.photo)}">`:`<span style="color:#a49b90">WATCH</span>`}</div></div><div class="panel"><div class="eyebrow">Watch ID</div><div class="profile-title">${esc(w.id)}</div><div class="profile-meta">${esc(w.brand||"")} ${esc(w.model||w.title||"")} · Ref. ${esc(w.ref||"—")} · Year ${esc(w.year||"—")}</div><div class="metrics"><div class="metric"><small>Status</small><b>${esc(st(w))}</b></div><div class="metric"><small>Cost</small><b>${money(costTo(w))}</b></div><div class="metric"><small>Asking</small><b>${money(w.asking)}</b></div></div><div class="rows"><div class="row"><span>Purchase date</span><b>${fmtDate(w.purchase)}</b></div><div class="row"><span>Source</span><b>${esc(w.source||"—")}</b></div><div class="row"><span>Potential / realized P&L</span><b class="${(st(w)==='available'?potential(w):realized(w))>=0?'good':'bad'}">${money(st(w)==='available'?potential(w):realized(w))}</b></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="btn" data-action="edit-watch" data-id="${esc(w.id)}">Edit</button><button class="btn" data-action="add-cost" data-id="${esc(w.id)}">+ Cost</button>${st(w)==='available'?`<button class="btn primary" data-action="sell-watch" data-id="${esc(w.id)}">Record sale</button><button class="btn" data-action="trade-watch" data-id="${esc(w.id)}">Record trade</button>`:`<button class="btn" data-action="return-watch" data-id="${esc(w.id)}">Return to inventory</button>`}</div></div></div><div class="panel" style="margin-top:14px"><h3>Cost history</h3><div class="cost-list">${(w.costs||[]).map((c,i)=>`<div class="cost-item"><span>${fmtDate(c.date)} · ${esc(c.type||"Cost")}${c.notes?` · ${esc(c.notes)}`:""}</span><b>${money(c.amount)}</b></div>`).join("")||'<div class="empty">No costs recorded.</div>'}<div class="cost-total"><span>Total cost</span><b>${money(costTo(w))}</b></div></div></div><div class="panel" style="margin-top:14px"><h3>Transaction history</h3><div class="history-list">${tx.map((t,i)=>`<div class="history-item"><div class="history-date">${fmtDate(t.date)}</div><div class="history-type">${esc(t.type||"")} · ${esc(t.status||"")}</div><div class="history-detail">${esc(t.counterparty||t.notes||"—")}</div><div class="history-amount">${money(t.amount)}</div></div>`).join("")||'<div class="empty">No transactions yet.</div>'}</div></div>`)}
function availableFunds(){const fin=db.funding.filter(x=>x.direction==='IN').reduce((a,x)=>a+Number(x.amount||0),0),fout=db.funding.filter(x=>x.direction==='OUT').reduce((a,x)=>a+Number(x.amount||0),0),cashIn=txRows().filter(x=>x.status==='completed').reduce((a,x)=>a+x.amount,0),opex=db.opex.reduce((a,x)=>a+Number(x.amount||0),0),other=db.otherCosts.reduce((a,x)=>a+Number(x.amount||0),0);return Number(db.settings?.openingFunds||0)+fin+cashIn-fout-opex-other}
function renderTransactions(){const tx=txRows();view("transactions",header("Transactions","Exits, operating spend, capital spend, and owner funding.",`<button class="btn primary" data-action="add-funding">+ Capital / funding</button>`)+`<div class="sectionline"><h3>Watch exits</h3><div class="filterbar"><input id="txSearch" placeholder="Search exits..." style="min-width:220px"><select id="txType"><option value="all">All exit types</option><option value="SALE">SALE</option><option value="TRADE">TRADE</option></select></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Watch</th><th>Exit Type</th><th>Status</th><th class="amount">Exit Value</th><th class="amount">Realized P/L</th><th></th></tr></thead><tbody>${tx.length?tx.map(x=>`<tr><td>${fmtDate(x.date)}</td><td><b>${esc(x.id)}</b><div style="font-size:12px;color:var(--muted)">${esc(db.watches.find(w=>w.id===x.id)?.model||"")}</div></td><td>${esc(x.type)}</td><td>${esc(x.status)}</td><td class="amount">${money(x.amount)}</td><td class="amount ${x.pl>=0?'good':'bad'}">${money(x.pl)}</td><td style="text-align:right"><button class="btn" data-action="edit-exit" data-id="${esc(x.id)}" data-type="${esc(x.type)}">Edit</button></td></tr>`).join(""):'<tr><td colspan="7" class="empty">No exits recorded.</td></tr>'}</tbody></table></div></div><div class="sectionline"><h3>Business spending</h3></div><div class="spend-shortcuts"><div class="spend-shortcut"><div><div class="eyebrow">Operating</div><h3>OPEX</h3><p>${money(db.opex.reduce((a,x)=>a+Number(x.amount||0),0))} recorded</p></div><button class="btn" data-action="view-opex">View</button><button class="btn primary" data-action="add-opex">+ Add</button></div><div class="spend-shortcut"><div><div class="eyebrow">Capital</div><h3>CAPEX</h3><p>${money(db.capex.reduce((a,x)=>a+Number(x.cost||0),0))} recorded</p></div><button class="btn" data-action="view-capex">View</button><button class="btn primary" data-action="add-capex">+ Add</button></div><div class="spend-shortcut"><div><div class="eyebrow">Other</div><h3>Other expenses</h3><p>${money(db.otherCosts.reduce((a,x)=>a+Number(x.amount||0),0))} recorded</p></div><button class="btn" data-action="view-other">View</button><button class="btn primary" data-action="add-other">+ Add</button></div><div class="spend-shortcut"><div><div class="eyebrow">Owner ledger</div><h3>Capital & funding</h3><p>${money(availableFunds())} available funds</p></div><button class="btn" data-action="view-funding">View</button><button class="btn primary" data-action="add-funding">+ Add</button></div></div>`)}
function renderAnalytics(){const sales=txRows().filter(x=>x.status==='completed'),pl=sales.reduce((a,x)=>a+x.pl,0),inv=db.watches.filter(w=>st(w)==='available').reduce((a,w)=>a+costTo(w),0),opex=db.opex.reduce((a,x)=>a+Number(x.amount||0),0),other=db.otherCosts.reduce((a,x)=>a+Number(x.amount||0),0),capex=db.capex.reduce((a,x)=>a+Number(x.cost||0),0);view("analytics",header("Analytics","Business performance and where the capital currently sits.",`<select id="analyticsRange" class="btn"><option value="all">All time</option><option value="year">This year</option></select>`)+`<div class="kpis"><div class="kpi"><small>Net Profit</small><strong class="${pl-opex-other>=0?'good':'bad'}">${money(pl-opex-other)}</strong></div><div class="kpi"><small>Current inventory</small><strong>${money(inv)}</strong></div><div class="kpi"><small>Available funds</small><strong>${money(availableFunds())}</strong></div><div class="kpi"><small>OPEX + Other</small><strong>${money(opex+other)}</strong></div><div class="kpi"><small>CAPEX</small><strong>${money(capex)}</strong></div></div><div class="analytics-grid"><div class="panel"><h3>Capital deployment</h3><div class="rows"><div class="row"><span>Inventory at cost</span><b>${money(inv)}</b></div><div class="row"><span>Business assets / CAPEX</span><b>${money(capex)}</b></div><div class="row"><span>OPEX + Other spent</span><b>${money(opex+other)}</b></div></div><div class="totalbox"><div><small>Total recorded deployment</small><b>${money(inv+capex+opex+other)}</b></div></div></div><div class="panel"><h3>Exit activity</h3><div class="rows"><div class="row"><span>Sales / trades</span><b>${sales.length}</b></div><div class="row"><span>Exit proceeds</span><b>${money(sales.reduce((a,x)=>a+x.amount,0))}</b></div><div class="row"><span>Realized P/L</span><b class="${pl>=0?'good':'bad'}">${money(pl)}</b></div></div></div></div>`)}

function saveOther(i){const g=k=>document.getElementById("f_r_"+k)?.value.trim(),x={date:g("date")||today(),category:g("category"),amount:Number(g("amount")||0),reference:g("reference"),notes:document.getElementById("f_r_notes")?.value||""};if(i===null||i===undefined)db.otherCosts.push(x);else db.otherCosts[i]=x;save().then(()=>{closeModal();renderTransactions();toast("Other expense saved.")}).catch(()=>{})}
function deleteOther(i){if(!confirm("Delete this other expense?"))return;db.otherCosts.splice(i,1);save().then(()=>{renderTransactions();toast("Other expense deleted.")}).catch(()=>{})}
function viewSpendModal(kind){const map={opex:[db.opex,"OPEX","amount"],capex:[db.capex,"CAPEX","cost"],other:[db.otherCosts,"Other","amount"]},[arr,title,key]=map[kind];modal(title,`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Details</th><th class="amount">Amount</th><th></th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.type||x.asset||x.category||"")}<div style="font-size:12px;color:var(--muted)">${esc(x.notes||x.reference||"")}</div></td><td class="amount">${money(x[key])}</td><td style="text-align:right"><button class="btn" data-action="edit-${kind}" data-index="${i}">Edit</button> <button class="btn" data-action="delete-${kind}" data-index="${i}">Delete</button></td></tr>`).join("")||'<tr><td colspan="4" class="empty">No entries.</td></tr>'}</tbody></table></div>`)}
function addFundingModal(i=null){const x=i==null?{}:db.funding[i];modal(i==null?"Add capital / funding":"Edit capital / funding",`<div class="formgrid">${field("f_date","Date",x.date||today(),"date")}${field("f_type","Type",x.type||"Owner Capital","text")}${field("f_direction","Direction",x.direction||"IN","text","IN or OUT")}${field("f_amount","Amount",x.amount||"","number")}<div class="field full"><label>Notes</label><textarea id="f_f_notes">${esc(x.notes||"")}</textarea></div></div><div class="notice" style="margin-top:12px">Suggested types: Owner Capital (IN), Owner Advance (IN), Owner Repayment (OUT).</div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="save-funding" data-index="${i==null?'':i}">${i==null?'Add':'Save'}</button>`)}
function saveFunding(i){const g=k=>document.getElementById("f_f_"+k)?.value.trim(),x={date:g("date")||today(),type:g("type")||"Owner Capital",direction:(g("direction")||"IN").toUpperCase()==="OUT"?"OUT":"IN",amount:Number(g("amount")||0),notes:document.getElementById("f_f_notes")?.value||""};if(i===null||i===undefined)db.funding.push(x);else db.funding[i]=x;save().then(()=>{closeModal();renderTransactions();toast("Funding saved.")}).catch(()=>{})}
function deleteFunding(i){if(!confirm("Delete this funding entry?"))return;db.funding.splice(i,1);save().then(()=>{renderTransactions();toast("Funding deleted.")}).catch(()=>{})}
function viewFundingModal(){const ins=db.funding.filter(x=>x.direction==='IN').reduce((a,x)=>a+Number(x.amount||0),0),outs=db.funding.filter(x=>x.direction==='OUT').reduce((a,x)=>a+Number(x.amount||0),0);modal("Capital & funding",`<div class="funding-summary"><div><span>In</span><b>${money(ins)}</b></div><div><span>Out</span><b>${money(outs)}</b></div><div><span>Available funds</span><b>${money(availableFunds())}</b></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Direction</th><th class="amount">Amount</th><th></th></tr></thead><tbody>${db.funding.map((x,i)=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.direction)}</td><td class="amount">${money(x.amount)}</td><td style="text-align:right"><button class="btn" data-action="edit-funding" data-index="${i}">Edit</button> <button class="btn" data-action="delete-funding" data-index="${i}">Delete</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">No funding entries.</td></tr>'}</tbody></table></div>`)}
function setOpeningFundsModal(){modal("Opening business funds",`<div class="notice">This is the starting cash position before recorded funding and transactions.</div><div class="field" style="margin-top:14px"><label>Opening funds</label><input id="openingFunds" type="number" value="${esc(db.settings.openingFunds||0)}"></div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="save-opening-funds">Save</button>`)}
function saveOpeningFunds(){db.settings.openingFunds=Number(document.getElementById("openingFunds")?.value||0);save().then(()=>{closeModal();render();toast("Opening funds saved.")}).catch(()=>{})}
function csvEsc(v){return '"'+String(v??"").replace(/"/g,'""')+'"'}
function downloadFile(name,text,mime="text/csv"){try{const isCsv=mime.includes("text/csv"),payload=isCsv?"\uFEFF"+text:text,href="data:"+mime+";charset=utf-8,"+encodeURIComponent(payload),a=document.createElement("a");a.href=href;a.download=name;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}catch(err){console.error(err);toast("Export failed. Try again.")}}
function exportCsv(name,headers,rows){downloadFile(name,[headers,...rows].map(r=>r.map(csvEsc).join(",")).join("\n"))}
function doExport(kind){if(kind==="inventory")exportCsv("tres_inventory.csv",["Watch ID","Title","Brand","Model","Year","Reference","Status","Acquired","Cost","Asking","P&L"],db.watches.map(w=>[w.id,w.title,w.brand,w.model,w.year,w.ref,w.status,w.purchase,costTo(w),w.asking,st(w)==="available"?potential(w):realized(w)||0]));else if(kind==="exits")exportCsv("tres_exits.csv",["Date","Watch ID","Watch","Type","Exit Value","Realized P/L"],txRows().map(x=>{const w=db.watches.find(y=>y.id===x.id);return[x.date,x.id,w?.title||x.id,x.type,x.amount,x.pl]}));else if(kind==="opex")exportCsv("tres_opex.csv",["Date","Type","Amount","Notes"],db.opex.map(x=>[x.date,x.type,x.amount,x.notes]));else if(kind==="capex")exportCsv("tres_capex.csv",["Date","Asset","Category","Cost","Notes"],db.capex.map(x=>[x.date,x.asset,x.category,x.cost,x.notes]));else if(kind==="other")exportCsv("tres_other.csv",["Date","Category","Amount","Reference","Notes"],db.otherCosts.map(x=>[x.date,x.category,x.amount,x.reference,x.notes]));else if(kind==="funding")exportCsv("tres_funding.csv",["Date","Type","Direction","Amount","Notes"],db.funding.map(x=>[x.date,x.type,x.direction,x.amount,x.notes]))}
(function(){const _analytics=renderAnalytics,_transactions=renderTransactions,_reports=renderReports;const showViewError=(id,title,err)=>{const el=document.getElementById(id);if(el)el.innerHTML=`<div class="panel empty" style="margin-top:4px"><b>${esc(title)} couldn't load.</b><div style="margin-top:7px;color:var(--muted);font-size:12px">${esc(err?.message||String(err))}</div><button class="btn" style="margin-top:14px" data-action="retry-${id}">Retry</button></div>`};window.__tresRetry={analytics:()=>{try{_analytics()}catch(e){showViewError('analytics','Analytics',e)}},transactions:()=>{try{_transactions()}catch(e){showViewError('transactions','Transactions',e)}},reports:()=>{try{_reports()}catch(e){showViewError('reports','Reports',e)}}};renderAnalytics=()=>window.__tresRetry.analytics();renderTransactions=()=>window.__tresRetry.transactions();renderReports=()=>window.__tresRetry.reports()})();
document.addEventListener("click",e=>{const sort=e.target.closest("[data-inv-sort]");if(sort){const key=sort.dataset.invSort;if(inventorySort.key===key)inventorySort.dir=inventorySort.dir==="desc"?"asc":"desc";else{inventorySort.key=key;inventorySort.dir=key==="purchase"?"desc":"asc"}inventoryPage=1;filterInventory();return}const pageBtn=e.target.closest("[data-inv-page]");if(pageBtn){const pg=Number(pageBtn.dataset.invPage||1);if(pg>=1){inventoryPage=pg;filterInventory()}return}const nav=e.target.closest(".nav[data-view]");if(nav){current=nav.dataset.view;document.getElementById("app").classList.remove("mobile-open");document.querySelectorAll(".nav[data-view]").forEach(n=>n.classList.toggle("active",n===nav));render();return}const a=e.target.closest("[data-action]");if(!a)return;const act=a.dataset.action,id=a.dataset.id;try{if(act==="retry-analytics"){window.__tresRetry?.analytics();return}else if(act==="retry-transactions"){window.__tresRetry?.transactions();return}else if(act==="retry-reports"){window.__tresRetry?.reports();return}else if(act==="open-watch"){currentWatch=id;current="profile";render()}else if(act==="edit-opex")addOpexModal(Number(a.dataset.index));else if(act==="save-opex")saveOpex(a.dataset.index===""?null:Number(a.dataset.index));else if(act==="delete-opex")deleteOpex(Number(a.dataset.index));else if(act==="edit-capex")addCapexModal(Number(a.dataset.index));else if(act==="save-capex")saveCapex(a.dataset.index===""?null:Number(a.dataset.index));else if(act==="delete-capex")deleteCapex(Number(a.dataset.index));else if(act==="edit-other")addOtherModal(Number(a.dataset.index));else if(act==="save-other")saveOther(a.dataset.index===""?null:Number(a.dataset.index));else if(act==="delete-other")deleteOther(Number(a.dataset.index));else if(act==="view-opex")viewSpendModal("opex");else if(act==="view-capex")viewSpendModal("capex");else if(act==="view-other")viewSpendModal("other");else if(act==="add-funding")addFundingModal();else if(act==="view-funding")viewFundingModal();else if(act==="edit-funding")addFundingModal(Number(a.dataset.index));else if(act==="save-funding")saveFunding(a.dataset.index===""?null:Number(a.dataset.index));else if(act==="delete-funding")deleteFunding(Number(a.dataset.index));else if(act==="save-exit")saveExit(id,a.dataset.type);else if(act==="edit-exit")editExit(id,a.dataset.type);else if(act==="export-inventory")doExport("inventory");else if(act==="export-exits")doExport("exits");else if(act==="export-opex")doExport("opex");else if(act==="export-capex")doExport("capex");else if(act==="export-other")doExport("other");else if(act==="export-funding")doExport("funding");else if(act==="export-json")downloadFile("tres_backup.json",JSON.stringify(db,null,2),"application/json");else if(act==="set-opening-funds")setOpeningFundsModal();else if(act==="save-opening-funds")saveOpeningFunds();else if(act==="export-all"){["inventory","exits","opex","capex","other"].forEach((k,i)=>setTimeout(()=>doExport(k),i*140));setTimeout(()=>downloadFile("tres_backup.json",JSON.stringify(db,null,2),"application/json"),750)}else if(act==="go-inventory"){current="inventory";render()}else if(act==="back-inventory"){current="inventory";render()}else if(act==="close")closeModal();else if(act==="add-watch")addWatchModal();else if(act==="edit-watch")editWatchModal(id);else if(act==="save-edit")saveEdit(id);else if(act==="add-cost")addCostModal(id);else if(act==="sell-watch")saleModal(id);else if(act==="complete-sale")completeSale(id);else if(act==="trade-watch")tradeModal(id);else if(act==="complete-trade")completeTrade(id);else if(act==="return-watch")returnInventory(id);else if(act==="create-watch")createWatch();else if(act==="create-cost")createCost();else if(act==="add-opex")addOpexModal();else if(act==="create-opex")createOpex();else if(act==="add-capex")addCapexModal();else if(act==="create-capex")createCapex();else if(act==="add-other")addOtherModal();else if(act==="create-other")createOther()}catch(err){console.error(err);toast("TRES hit an error. Refresh the page and try again.")}});
document.addEventListener("input",e=>{if(e.target.id.startsWith("f_aw_")&&e.target.type!=="file")rememberField(e.target.id.slice(2),e.target.value);if(e.target.id==="homeSearch"){const box=document.getElementById("homeResults");if(box)box.innerHTML=search(e.target.value).filter(w=>st(w)==="available").map(card).join("")||'<div class="panel empty" style="grid-column:1/-1">No watches found.</div>'}if(e.target.id==="invSearch"){inventoryPage=1;filterInventory()}if(e.target.id==="txSearch")filterTransactions()});
document.addEventListener("change",e=>{if(e.target.id==="invStatus"||e.target.id==="invBrand"){inventoryPage=1;filterInventory()}if(e.target.id==="txType")renderTransactions();if(e.target.id==="analyticsRange")renderAnalytics()});

document.getElementById("mobileMenu").addEventListener("click",()=>{const app=document.getElementById("app"),open=app.classList.toggle("mobile-open");document.getElementById("mobileMenu").setAttribute("aria-expanded",String(open))});document.getElementById("mobileOverlay").addEventListener("click",()=>document.getElementById("app").classList.remove("mobile-open"));document.getElementById("collapse").addEventListener("click",()=>{const app=document.getElementById("app"),c=app.classList.toggle("collapsed");document.getElementById("collapse").textContent=c?"›":"‹"});
async function boot(){try{const{data,error}=await supabaseClient.from("app_state").select("data").eq("id","tres").maybeSingle();if(error)throw error;db=normalizeDb(data?.data||{watches:[],opex:[],capex:[],otherCosts:[],funding:[],settings:{openingFunds:0}});render();toast("TRES database connected.")}catch(e){console.error("Supabase load failed",e);db=normalizeDb({watches:[],opex:[],capex:[],otherCosts:[],funding:[],settings:{openingFunds:0}});render();toast("Database connection failed. Check Supabase settings.")}}boot();
