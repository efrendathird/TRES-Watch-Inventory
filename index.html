function filterInventory(){const q=document.getElementById("invSearch")?.value||"",s=document.getElementById("invStatus")?.value||"available",b=document.getElementById("invBrand")?.value||"all";inventoryPageSize=20;let a=search(q);if(s!=="all")a=a.filter(w=>st(w)===s);if(b!=="all")a=a.filter(w=>w.brand===b);const valueFor=(w,key)=>key==="purchase"?String(w.purchase||""):key==="cost"?costTo(w):key==="asking"?(st(w)==="available"?Number(w.asking||0):Number(w.sale?.price||0)+Number(w.trade?.allowance||0)+Number(w.trade?.cash||0)):key==="pl"?(st(w)==="available"?potential(w):Number(realized(w)||0)):key==="status"?st(w):String(w.title||w.brand+" "+w.model||"");a.sort((x,y)=>{const A=valueFor(x,inventorySort.key),B=valueFor(y,inventorySort.key);return compareValues(A,B,inventorySort.dir)});const pages=Math.max(1,Math.ceil(a.length/inventoryPageSize));inventoryPage=Math.min(Math.max(1,inventoryPage),pages);const offset=(inventoryPage-1)*inventoryPageSize,shown=a.slice(offset,offset+inventoryPageSize);const head=(label,key)=>`<button class="sort-head ${inventorySort.key===key?"active "+inventorySort.dir:""}" data-inv-sort="${key}">${label}</button>`;const pager=`<div class="pager"><span class="inv-meta">Showing ${a.length?offset+1:0}–${Math.min(offset+inventoryPageSize,a.length)} of ${a.length}</span><div class="pager-controls"><button class="pagebtn" ${inventoryPage<=1?"disabled":""} data-inv-page="${inventoryPage-1}">‹</button>${Array.from({length:Math.min(7,pages)},(_,i)=>{let pg;if(pages<=7)pg=i+1;else if(inventoryPage<=4)pg=i+1;else if(inventoryPage>=pages-3)pg=pages-6+i;else pg=inventoryPage-3+i;return `<button class="pagebtn ${pg===inventoryPage?"active":""}" data-inv-page="${pg}">${pg}</button>`}).join("")}<button class="pagebtn" ${inventoryPage>=pages?"disabled":""} data-inv-page="${inventoryPage+1}">›</button></div></div>`;document.getElementById("invResults").innerHTML=`<div class="panel tablewrap"><table class="table"><thead><tr><th>${head("Watch","title")}</th> function renderProfile(){
  const w=db.watches.find(x=>x.id===currentWatch);
  if(!w){current="inventory";return render()}

  // Costing is displayed as simple ledger lines:
  // base Cost Price + additional cost categories. Notes belong in History.
  const grouped={};
  (w.costs||[]).forEach(c=>{
    const raw=String(c.type||"Other").trim()||"Other";
    const lower=raw.toLowerCase();
    const baseNames=["purchase","acquisition","trade","trade-in"];
    if(baseNames.includes(lower)) return;

    let label=raw;
    if(lower==="travel and transportation" || lower==="travel") label="Travel";
    else if(lower==="polish" || lower==="service") label="Service";
    else if(lower==="photo" || lower==="photography") label="Photography";
    else if(lower==="authentication" || lower==="auth") label="Authentication";
    else if(lower==="food") label="Food";
    else if(lower==="shipping" || lower==="delivery") label="Shipping";

    const amount=costAmount(c);
    if(amount>0) grouped[label]=(grouped[label]||0)+amount;
  });

  const base=baseCostTo(w);
  const total=base+Object.values(grouped).reduce((a,v)=>a+Number(v||0),0);
  const pl=st(w)==="available"?potential(w):realized(w)||0;

  const orderedLabels=["Authentication","Travel","Photography","Service","Shipping","Food"];
  const orderedEntries=[];
  orderedLabels.forEach(k=>{if(grouped[k]) orderedEntries.push([k,grouped[k]])});
  Object.entries(grouped)
    .filter(([k])=>!orderedLabels.includes(k))
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .forEach(x=>orderedEntries.push(x));

  const costRows=[
    `<div class="cost-item"><span>Cost</span><b>${money(base)}</b></div>`,
    ...orderedEntries.map(([k,v])=>`<div class="cost-item"><span>${esc(k)}</span><b>${money(v)}</b></div>`)
  ].join("");

  const historyCount=(w.costs||[]).length+(w.sale?1:0)+(w.trade?1:0);

  document.getElementById("profile").innerHTML=`
    <div class="pagehead">
      <div><button class="btn" data-action="back-inventory">← Inventory</button></div>
      <div><button class="btn" data-action="edit-watch" data-id="${esc(w.id)}">Edit watch</button></div>
    </div>

    <div class="profile-shell">
      <div class="profile-visual">
        <div class="profile-photo">
          ${w.photo?`<img src="${w.photo}" alt="">`:`<span class="muted">NO PHOTO</span>`}
        </div>
      </div>

      <div class="profile-info">
        <div class="muted">${esc(w.id)}</div>
        <div class="profile-title">${esc(displayWatchName(w))}</div>
        <div class="profile-meta">${esc(w.brand)} · ${esc(w.year||"")} · Ref. ${esc(w.ref||"—")}</div>
        <span class="tag">${statusLabel(w)}</span>

        <div class="metrics">
          <div class="metric"><small>Cost</small><b>${money(total)}</b></div>
          <div class="metric">
            <small>${st(w)==="available"?"Asking":"Exit value"}</small>
            <b>${money(st(w)==="available"?w.asking:(w.sale?.price||Number(w.trade?.allowance||0)+Number(w.trade?.cash||0)))}</b>
          </div>
          <div class="metric">
            <small>${st(w)==="available"?"Potential":"Realized"} P/L</small>
            <b class="${pl>=0?"good":"bad"}">${money(pl)}</b>
          </div>
        </div>

        <div class="panel">
          <h3>Watch details</h3>
          <div class="rows">
            ${row("Condition",w.condition)}
            ${row("Box / Papers",w.bp)}
            ${row("Reference",w.ref)}
            ${row("Year",w.year)}
            ${row("Case Size",w.caseSizeMm?String(w.caseSizeMm)+" mm":"—")}
            ${row("Dial",w.dial||"—")}
            ${row("Acquired",dateFmt(w.purchase))}
          </div>
        </div>

      </div>
    </div>

    <div class="panel profile-actions-panel">
      <h3>Actions</h3>
      <div class="profile-actions-row">
        ${st(w)==="available"
          ?`<button class="btn" data-action="add-cost" data-id="${esc(w.id)}">＋ Add cost</button>
            <button class="btn" data-action="sell-watch" data-id="${esc(w.id)}">✓ Record sale</button>
            <button class="btn" data-action="trade-watch" data-id="${esc(w.id)}">⇄ Record trade</button>`
          :`<button class="btn" data-action="return-watch" data-id="${esc(w.id)}">↩ Return to inventory</button>`}
      </div>
    </div>

    <div class="sectionbar"><h3>Costing</h3></div>
    <div class="profile-ledger">
      <div class="panel costing-panel">
        <div class="cost-list">${costRows || '<div class="empty" style="padding:20px 0">No costs recorded.</div>'}</div>
        <div class="cost-total"><span>Total cost</span><b>${money(total)}</b></div>
      </div>

      <div class="sectionbar history-heading"><h3>History</h3><span class="muted">${historyCount} entries</span></div>
      <div class="panel">${history(w)}</div>
    </div>`;
}

function row(a,b){return`<div class="row"><span>${esc(a)}</span><b>${esc(b??"—")}</b></div>`}
function compareValues(a,b,dir){if(typeof a==="number"&&typeof b==="number")return dir==="asc"?a-b:b-a;return dir==="asc"?String(a??"").localeCompare(String(b??"")):String(b??"").localeCompare(String(a??""))}
function sortButton(label,state,key){return`<button class="sort-head ${state.key===key?"active "+state.dir:""}" data-table-sort="${key}">${label}</button>`}
function sortCollection(arr,state,getter){return arr.slice().sort((a,b)=>compareValues(getter(a,state.key),getter(b,state.key),state.dir))}
function rangeStart(days){if(days==="lifetime"||days===null||days===undefined)return null;const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-Number(days));return d.toISOString().slice(0,10)}
function inRange(date,start){return !start || (date && String(date).slice(0,10)>=start)}
function aging(av){const buckets={"0–30 days":0,"31–60 days":0,"61–90 days":0,"91–180 days":0,"181+ days":0};const now=new Date();av.forEach(w=>{const d=new Date(String(w.purchase||today()).slice(0,10)+"T00:00:00");const days=Math.max(0,Math.floor((now-d)/86400000));if(days<=30)buckets["0–30 days"]++;else if(days<=60)buckets["31–60 days"]++;else if(days<=90)buckets["61–90 days"]++;else if(days<=180)buckets["91–180 days"]++;else buckets["181+ days"]++;});return Object.entries(buckets).map(([k,v])=>row(k,v)).join("")}

function history(w){let h=[];(w.costs||[]).forEach(c=>h.push({d:c.date,t:c.type,v:costAmount(c),n:c.notes||""}));if(w.sale)h.push({d:w.sale.date,t:"SALE",v:w.sale.price,n:[w.sale.payment,w.sale.buyer,w.sale.notes].filter(Boolean).join(" · ")});if(w.trade)h.push({d:w.trade.date,t:"TRADE OUT",v:Number(w.trade.allowance||0)+Number(w.trade.cash||0),n:"Received: "+((w.trade.received||[]).join(", ")||"—")+(w.trade.notes?" · "+w.trade.notes:"")});h.sort((a,b)=>String(a.d).localeCompare(String(b.d)));return h.length?`<div class="history-list">${h.map(x=>`<div class="history-item"><div class="history-date">${dateFmt(x.d)}</div><div class="history-type">${esc(x.t)}</div><div class="history-detail">${esc(x.n||"—")}</div><div class="history-amount">${money(x.v)}</div></div>`).join("")}</div>`:"<div class='empty' style='padding:24px 0'>No history yet.</div>"}

  const lifetimeSelling=allSales.reduce((a,x)=>{const w=db.watches.find(y=>y.id===x.id);return a+Number(w?.sale?.expense||0)},0);
  const fundingIn=db.funding.filter(x=>inRange(x.date,start)&&String(x.direction||'IN')==='IN').reduce((a,x)=>a+Number(x.amount||0),0);
  const fundingOut=db.funding.filter(x=>inRange(x.date,start)&&String(x.direction||'IN')==='OUT').reduce((a,x)=>a+Number(x.amount||0),0);
  const lifetimeFundingIn=db.funding.filter(x=>String(x.direction||'IN')==='IN').reduce((a,x)=>a+Number(x.amount||0),0);
  const lifetimeFundingOut=db.funding.filter(x=>String(x.direction||'IN')==='OUT').reduce((a,x)=>a+Number(x.amount||0),0);
  const lifetimeCashOut=lifetimeWatchCashSpend+lifetimeOpex+lifetimeOther+lifetimeCapex+lifetimeSelling;
  const availableFunds=openingFunds+lifetimeFundingIn+lifetimeCashIn-lifetimeCashOut-lifetimeFundingOut;
  const currentFundingNet=lifetimeFundingIn-lifetimeFundingOut;
  const currentTied=invCost+capex;
  const totalRecordedDeployment=invCost+capex+opex+other;
  const spending=opex+other+capex;
  const rangeLabel=range==="lifetime"?"Lifetime":`Last ${range} days`,year=new Date().getFullYear();
  const months=Array.from({length:12},(_,i)=>{const d=new Date(year,i,1);return{key:`${year}-${String(i+1).padStart(2,'0')}`,label:d.toLocaleDateString('en-US',{month:'short'})}});
  const monthVals=months.map(m=>events.filter(x=>String(x.date||'').slice(0,7)===m.key).reduce((a,x)=>a+Number(x.pl||0),0));
  const maxVal=Math.max(1,...monthVals.map(v=>Math.abs(v))),avg=events.length?events.reduce((a,x)=>a+Number(x.pl||0),0)/events.length:0;
  document.getElementById("analytics").innerHTML=`<div class="pagehead"><div><h1>Analytics</h1><p>Financial performance, inventory position, and where business funds are deployed.</p></div><select id="analyticsRange" class="analytics-filter"><option value="lifetime" ${range==="lifetime"?'selected':''}>Lifetime</option><option value="30" ${range==="30"?'selected':''}>Last 30 days</option><option value="60" ${range==="60"?'selected':''}>Last 60 days</option><option value="90" ${range==="90"?'selected':''}>Last 90 days</option><option value="180" ${range==="180"?'selected':''}>Last 180 days</option><option value="365" ${range==="365"?'selected':''}>Last 365 days</option></select></div>
  <div class="analytics-finance"><div class="analytics-maincard"><div class="eyebrow">${rangeLabel} · NET PROFIT</div><div class="analytics-net ${net<0?'bad':''}">${money(net)}</div><div class="finance-line"><span>Revenue / Exit Value</span><b>${money(revenue)}</b></div><div class="finance-line"><span>COGS</span><b>${money(cogs)}</b></div><div class="finance-line"><span>Gross Profit</span><b class="${gross>=0?'good':'bad'}">${money(gross)}</b></div><div class="finance-line"><span>OPEX + Other</span><b>${money(opex+other)}</b></div></div><div class="analytics-sidecard"><div class="eyebrow">CURRENT INVENTORY</div><div class="inventory-big"><b>${av.length}</b><span>watches in stock</span></div><div class="finance-line"><span>Cost basis</span><b>${money(invCost)}</b></div><div class="finance-line"><span>Asking value</span><b>${money(asking)}</b></div><div class="finance-line"><span>Unrealized P/L</span><b class="${unrealized>=0?'good':'bad'}">${money(unrealized)}</b></div><div class="finance-line"><span>Inventory ROI</span><b>${invRoi.toFixed(1)}%</b></div></div></div>
  <div class="cashmap"><div class="cashcard dark"><div class="eyebrow">CURRENT · AVAILABLE FUNDS</div><div class="cashbig ${availableFunds<0?'bad':''}">${money(availableFunds)}</div><div class="cashrow"><span>Opening business funds</span><b>${money(openingFunds)}</b></div><div class="cashrow"><span>Funding in</span><b>${money(lifetimeFundingIn)}</b></div><div class="cashrow"><span>Cash received</span><b>${money(lifetimeCashIn)}</b></div><div class="cashrow"><span>Recorded cash out</span><b>${money(lifetimeCashOut+lifetimeFundingOut)}</b></div></div><div class="cashcard"><h3>Where the capital is</h3><div class="deployment-grid"><div class="deployment-card"><small>Inventory at cost</small><b>${money(invCost)}</b></div><div class="deployment-card"><small>Business assets</small><b>${money(capex)}</b></div><div class="deployment-card"><small>OPEX + Other spent</small><b>${money(opex+other)}</b></div><div class="deployment-card"><small>Total recorded deployment</small><b>${money(totalRecordedDeployment)}</b></div></div></div></div>
  <div class="analytics-section"><div class="analytics-section-head"><h3>Realized P/L by month</h3><span>${year}</span></div><div class="analytics-chart"><div class="chart-grid">${months.map((m,i)=>{const v=monthVals[i],h=Math.max(4,Math.abs(v)/maxVal*82);return `<div class="chart-col"><div class="chart-bar ${v<0?'negative':''}" style="height:${h}%" title="${m.key}: ${money(v)}"></div><div class="chart-value">${v?money(v):''}</div><div class="chart-label">${m.label}</div></div>`}).join('')}</div></div></div>
  <div class="analytics-section analytics-ledger-wrap"><div class="analytics-section-head"><h3>Profit & spending</h3><span>${rangeLabel}</span></div><table class="table analytics-ledger"><thead><tr><th>Line item</th><th class="amount">Amount</th></tr></thead><tbody><tr><td>Revenue / Exit Value</td><td class="amount">${money(revenue)}</td></tr><tr><td>COGS</td><td class="amount">${money(cogs)}</td></tr><tr><td>Gross Profit</td><td class="amount ${gross>=0?'good':'bad'}">${money(gross)}</td></tr><tr><td>Selling Expenses</td><td class="amount">${money(selling)}</td></tr><tr><td>OPEX</td><td class="amount">${money(opex)}</td></tr><tr><td>Other</td><td class="amount">${money(other)}</td></tr><tr class="totalrow"><td><b>Net Profit</b></td><td class="amount"><b class="${net>=0?'good':'bad'}">${money(net)}</b></td></tr></tbody></table></div>
  <div class="analytics-two-col"><div class="analytics-section clean-list"><div class="analytics-section-head"><h3>Exit activity</h3><span>${rangeLabel}</span></div>${row('Sales',sold.length)}${row('Trades',traded.length)}${row('Total exits',events.length)}${row('Average realized P/L',events.length?money(avg):'—')}</div><div class="analytics-section clean-list"><div class="analytics-section-head"><h3>Capital & spending</h3><span>${rangeLabel}</span></div>${row('OPEX',money(opex))}${row('CAPEX',money(capex))}${row('Other',money(other))}${row('Funding in',money(fundingIn))}${row('Funding out',money(fundingOut))}${row('Total spending',money(spending))}</div></div>
  <div class="analytics-section clean-list"><div class="analytics-section-head"><h3>Inventory aging</h3><span>Available watches only</span></div>${aging(av)}</div>`}

function setOpeningFundsModal(){const current=Number(db.settings.openingFunds||0);openModal(`<div><div class="muted">Business capital</div><h2>Set opening funds</h2></div>`,`<div class="notice" style="margin-bottom:14px">Enter the amount of business money available at the start of the records. This lets TRES estimate how much is currently available after recorded cash activity.</div><div class="field"><label>Opening business funds</label><input id="f_of" type="number" value="${current}" min="0" step="1" placeholder="0"></div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="save-opening-funds">Save</button>`)}

function renderReports(){const av=db.watches.filter(w=>st(w)==="available"),ex=txRows(),invCost=av.reduce((a,w)=>a+costTo(w),0),ask=av.reduce((a,w)=>a+Number(w.asking||0),0),rpl=ex.reduce((a,x)=>a+Number(x.pl||0),0),openingFunds=Number(db.settings?.openingFunds||0);document.getElementById("reports").innerHTML=`<div class="pagehead"><div><h1>Reports</h1><p>Manage your opening funds and export your TRES records whenever you need them.</p></div><button class="btn primary" data-action="export-all">⇩ Export all</button></div><div class="report-grid"><div class="report-card"><h3>Opening funds</h3><p>Current amount: <b>${money(openingFunds)}</b></p><button class="btn" data-action="set-opening-funds">${openingFunds?"Edit opening funds":"Set opening funds"}</button></div><div class="report-card"><h3>Inventory</h3><p>${av.length} available watches · Cost basis ${money(invCost)} · Asking ${money(ask)}</p><button class="btn" data-action="export-inventory">Export CSV</button></div><div class="report-card"><h3>Sales & trades</h3><p>${ex.length} exits · Realized P/L ${money(rpl)}</p><button class="btn" data-action="export-exits">Export CSV</button></div><div class="report-card"><h3>OPEX</h3><p>${db.opex.length} entries · ${money(db.opex.reduce((a,x)=>a+Number(x.amount||0),0))}</p><button class="btn" data-action="export-opex">Export CSV</button></div><div class="report-card"><h3>CAPEX</h3><p>${db.capex.length} entries · ${money(db.capex.reduce((a,x)=>a+Number(x.cost||0),0))}</p><button class="btn" data-action="export-capex">Export CSV</button></div><div class="report-card"><h3>Other</h3><p>${db.otherCosts.length} entries · ${money(db.otherCosts.reduce((a,x)=>a+Number(x.amount||0),0))}</p><button class="btn" data-action="export-other">Export CSV</button></div><div class="report-card"><h3>Capital & funding</h3><p>${db.funding.length} entries · Net ${money(fundingStats().in-fundingStats().out)}</p><button class="btn" data-action="export-funding">Export CSV</button></div><div class="report-card"><h3>Full backup</h3><p>Complete TRES data in one JSON file.</p><button class="btn" data-action="export-json">Download JSON backup</button></div></div>`}
function csvEsc(v){const s=String(v??"");return '"'+s.replaceAll('"','""')+'"'}
function downloadFile(name,text,mime="text/csv"){
  try{
    const isCsv=mime.includes("text/csv");
    const payload=isCsv?"\uFEFF"+text:text;
    const href="data:"+mime+";charset=utf-8,"+encodeURIComponent(payload);
    const a=document.createElement("a");
    a.href=href;
    a.download=name;
    a.target="_blank";
    a.rel="noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(err){
    console.error(err);
    toast("Export failed. Try again.");
  }
}
function exportCsv(name,headers,rows){downloadFile(name,[headers,...rows].map(r=>r.map(csvEsc).join(",")).join("\n"))}
function doExport(kind){if(kind==="inventory")exportCsv("tres_inventory.csv",["Watch ID","Title","Brand","Model","Year","Reference","Status","Acquired","Cost","Asking","P&L"],db.watches.map(w=>[w.id,w.title,w.brand,w.model,w.year,w.ref,w.status,w.purchase,costTo(w),w.asking,st(w)==="available"?potential(w):realized(w)||0]));else if(kind==="exits")exportCsv("tres_exits.csv",["Date","Watch ID","Watch","Type","Exit Value","Realized P/L"],txRows().map(x=>{const w=db.watches.find(y=>y.id===x.id);return[x.date,x.id,w?.title||x.id,x.type,x.amount,x.pl]}));else if(kind==="opex")exportCsv("tres_opex.csv",["Date","Type","Amount","Notes"],db.opex.map(x=>[x.date,x.type,x.amount,x.notes]));else if(kind==="capex")exportCsv("tres_capex.csv",["Date","Asset","Category","Cost","Notes"],db.capex.map(x=>[x.date,x.asset,x.category,x.cost,x.notes]));else if(kind==="other")exportCsv("tres_other.csv",["Date","Category","Amount","Reference","Notes"],db.otherCosts.map(x=>[x.date,x.category,x.amount,x.reference,x.notes]));else if(kind==="funding")exportCsv("tres_funding.csv",["Date","Type","Direction","Amount","Notes"],db.funding.map(x=>[x.date,x.type,x.direction,x.amount,x.notes]));}
// Last-line render hardening: a view error should never leave the content area blank.
(function(){
  const _analytics=renderAnalytics, _transactions=renderTransactions, _reports=renderReports;
  const showViewError=(id,title,err)=>{const el=document.getElementById(id);if(el)el.innerHTML=`<div class="panel empty" style="margin-top:4px"><b>${esc(title)} couldn't load.</b><div style="margin-top:7px;color:var(--muted);font-size:12px">${esc(err?.message||String(err))}</div><button class="btn" style="margin-top:14px" data-action="retry-${id}">Retry</button></div>`};
  window.__tresRetry={analytics:()=>{try{_analytics()}catch(e){showViewError('analytics','Analytics',e)}},transactions:()=>{try{_transactions()}catch(e){showViewError('transactions','Transactions',e)}},reports:()=>{try{_reports()}catch(e){showViewError('reports','Reports',e)}}};
  renderAnalytics=()=>window.__tresRetry.analytics();
  renderTransactions=()=>window.__tresRetry.transactions();
  renderReports=()=>window.__tresRetry.reports();
})();

  if(sort){const key=sort.dataset.invSort;if(inventorySort.key===key)inventorySort.dir=inventorySort.dir==="desc"?"asc":"desc";else{inventorySort.key=key;inventorySort.dir=key==="purchase"?"desc":"asc"}inventoryPage=1;filterInventory();return;}
  const pageBtn=e.target.closest("[data-inv-page]");
  if(pageBtn){const pg=Number(pageBtn.dataset.invPage||1);if(pg>=1){inventoryPage=pg;filterInventory();}return;}
  const ts=e.target.closest("[data-table-sort]");
  if(ts){const key=ts.dataset.tableSort;const panel=ts.closest(".panel");const title=panel?.querySelector("h3")?.textContent?.trim();let state=txSort;if(title==="OPEX")state=opexSort;else if(title==="CAPEX")state=capexSort;else if(title==="Other")state=otherSort;if(state.key===key)state.dir=state.dir==="desc"?"asc":"desc";else{state.key=key;state.dir=key==="date"?"desc":"asc"}renderTransactions();return;}
  const nav=e.target.closest(".nav[data-view]");

    else if(act==="edit-capex")addCapexModal(Number(a.dataset.index));
    else if(act==="save-capex")saveCapex(a.dataset.index===""?null:Number(a.dataset.index));
    else if(act==="delete-capex")deleteCapex(Number(a.dataset.index));
    else if(act==="edit-other")addOtherModal(Number(a.dataset.index));
    else if(act==="save-other")saveOther(a.dataset.index===""?null:Number(a.dataset.index));
    else if(act==="delete-other")deleteOther(Number(a.dataset.index));
    else if(act==="view-opex")viewSpendModal("opex");
    else if(act==="view-capex")viewSpendModal("capex");
    else if(act==="view-other")viewSpendModal("other");
    else if(act==="add-funding")addFundingModal();
    else if(act==="view-funding")viewFundingModal();
    else if(act==="edit-funding")addFundingModal(Number(a.dataset.index));
    else if(act==="save-funding")saveFunding(a.dataset.index===""?null:Number(a.dataset.index));
    else if(act==="delete-funding")deleteFunding(Number(a.dataset.index));
    else if(act==="save-exit")saveExit(id,a.dataset.type);

    else if(act==="export-inventory")doExport("inventory");
    else if(act==="export-exits")doExport("exits");
    else if(act==="export-opex")doExport("opex");
    else if(act==="export-capex")doExport("capex");
    else if(act==="export-other")doExport("other");
    else if(act==="export-funding")doExport("funding");
    else if(act==="export-json")downloadFile("tres_backup.json",JSON.stringify(db,null,2),"application/json");
    else if(act==="set-opening-funds")setOpeningFundsModal();

  }catch(err){console.error(err);toast("TRES hit an error. Refresh the page and try again.")}
});

async function boot(){
  try{
    if(supabaseClient){
      const {data,error}=await supabaseClient.from("app_state").select("data").eq("id","tres").maybeSingle();
      if(error)throw error;
      if(data?.data) db=normalizeDb(data.data);
      else {
        try{db=normalizeDb(JSON.parse(localStorage.getItem("tres_house_v2")||""))}catch(_){db=normalizeDb({watches:[],opex:[],capex:[],otherCosts:[],funding:[],settings:{openingFunds:0}})}
        await save();
      }
    }else{
      try{db=normalizeDb(JSON.parse(localStorage.getItem("tres_house_v2")||""))}catch(_){db=normalizeDb({watches:[],opex:[],capex:[],otherCosts:[],funding:[],settings:{openingFunds:0}})}
    }
  }catch(e){
    console.error("TRES boot failed",e);
    try{db=normalizeDb(JSON.parse(localStorage.getItem("tres_house_v2")||""))}catch(_){}
    toast("Could not sync with database. Using local data.");
  }
  render();
}
boot();
