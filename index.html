function row(a,b){return`<div class="row"><span>${esc(a)}</span><b>${esc(b??"—")}</b></div>`}
function compareValues(a,b,dir){if(typeof a==="number"&&typeof b==="number")return dir==="asc"?a-b:b-a;return dir==="asc"?String(a??"").localeCompare(String(b??"")):String(b??"").localeCompare(String(a??""))}
function sortButton(label,state,key){return`<button class="sort-head ${state.key===key?"active "+state.dir:""}" data-table-sort="${key}">${label}</button>`}
function sortCollection(arr,state,getter){return arr.slice().sort((a,b)=>compareValues(getter(a,state.key),getter(b,state.key),state.dir))}
function rangeStart(days){if(days==="lifetime"||days===null||days===undefined)return null;const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-Number(days));return d.toISOString().slice(0,10)}
function inRange(date,start){return !start || (date && String(date).slice(0,10)>=start)}
function aging(av){const buckets={"0–30 days":0,"31–60 days":0,"61–90 days":0,"91–180 days":0,"181+ days":0};const now=new Date();av.forEach(w=>{const d=new Date(String(w.purchase||today()).slice(0,10)+"T00:00:00");const days=Math.max(0,Math.floor((now-d)/86400000));if(days<=30)buckets["0–30 days"]++;else if(days<=60)buckets["31–60 days"]++;else if(days<=90)buckets["61–90 days"]++;else if(days<=180)buckets["91–180 days"]++;else buckets["181+ days"]++;});return Object.entries(buckets).map(([k,v])=>row(k,v)).join("")}

function history(w){
  let h=[];
  (w.costs||[]).forEach((c,i)=>h.push({d:c.date,t:c.type,v:costAmount(c),n:c.notes||"",isCost:true,index:i}));
  if(w.tradeReceived&&Array.isArray(w.tradeReceived)){
    w.tradeReceived.forEach(r=>h.push({d:r.date,t:"TRADE IN",v:Number(r.allocatedValue||0),n:`Source: TRADE · From: ${r.fromWatchId||"—"}`}));
  }
  if(w.sale)h.push({d:w.sale.date,t:"SALE",v:w.sale.price,n:[w.sale.payment,w.sale.buyer,w.sale.notes].filter(Boolean).join(" · ")});
  if(w.trade)h.push({d:w.trade.date,t:"TRADE OUT",v:Number(w.trade.allowance||0)+Number(w.trade.cash||0),n:"Received: "+((w.trade.received||[]).join(", ")||"—")+(w.trade.notes?" · "+w.trade.notes:"")});
  h.sort((a,b)=>String(a.d).localeCompare(String(b.d)));
  return h.length?`<div class="history-list">${h.map(x=>`<div class="history-item"><div class="history-date">${dateFmt(x.d)}</div><div class="history-type">${esc(x.t)}</div><div class="history-detail">${esc(x.n||"—")}</div><div class="history-amount">${money(x.v)}</div><div class="history-actions">${x.isCost?`<button class="history-icon" title="Edit" aria-label="Edit cost" data-action="edit-cost" data-id="${esc(w.id)}" data-index="${x.index}">✎</button><button class="history-icon danger" title="Delete" aria-label="Delete cost" data-action="delete-cost" data-id="${esc(w.id)}" data-index="${x.index}">🗑</button>`:""}</div></div>`).join("")}</div>`:"<div class='empty' style='padding:24px 0'>No history yet.</div>"
}

    if(!allocations.length)return toast("At least one received watch is required.");

    // Keep incoming-trade history aligned with the edited trade.

    w.txdate=w.trade.date;
  } else {
    return toast("Transaction details are unavailable.");

  closeModal();

}

async function completeTrade(id){
  const w=db.watches.find(x=>String(x.id)===String(id)),d=document.getElementById('f_t_d')?.value||today();
  if(!w)return toast('Outgoing watch not found.');
  const selected=[...document.querySelectorAll('#tradeWatchList .trade-watch-check:checked')].map(ch=>{const id=String(ch.value);const inp=document.querySelector(`.trade-alloc-input[data-watch-id="${CSS.escape(id)}"]`);return {watchId:id,value:Math.max(0,Number(inp?.value||0))};});
  const cash=Math.max(0,Number(document.getElementById('f_t_cash')?.value||0));
  const notes=document.getElementById('f_t_n')?.value||'';
  if(!selected.length)return toast('Select at least one existing watch.');
  if(selected.some(x=>!x.value))return toast('Every selected watch needs an allocation.');
  const allowance=selected.reduce((a,x)=>a+x.value,0);
  if(w.trade)return toast('This watch already has a trade recorded.');
  selected.forEach(item=>{
    const rw=db.watches.find(x=>String(x.id)===String(item.watchId));
    if(rw){
      rw.tradeReceived=rw.tradeReceived||[];
      rw.tradeReceived.push({fromWatchId:String(w.id),date:d,allocatedValue:item.value});
      rw.source=rw.source||'TRADE';
      if(Number(rw.costPrice||0)<=0) rw.costPrice=item.value;
      rw.tx=rw.tx||'TRADE-IN';
      rw.txdate=rw.txdate||d;
    }
  });
  w.status='Traded';w.tx='TRADE';w.txdate=d;w.tradefor=selected.map(x=>x.watchId).join('\n');
  w.trade={date:d,allowance,cash,received:selected.map(x=>x.watchId),allocations:selected,notes};
  if(cash){w.revenues=w.revenues||[];w.revenues.push({date:d,source:'TRADE',received:'Cash',value:cash,notes:'Cash received'});}
  if(!(await save()))return;
  closeModal();toast('Trade recorded.');currentWatch=selected[0].watchId;current='profile';render();
}

function filterTransactions(){
  let exits=[];
  db.watches.forEach(w=>{
    if(w.sale) exits.push({id:w.id,date:w.sale.date,type:"SALE",amount:Number(w.sale.price||0),pl:Number(realized(w)||0)});
    if(w.trade) exits.push({id:w.id,date:w.trade.date,type:"TRADE",amount:Number(w.trade.allowance||0)+Number(w.trade.cash||0),pl:Number(realized(w)||0)});
  });
  exits.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const q=(document.getElementById("txSearch")?.value||"").trim().toLowerCase();
  const txType=document.getElementById("txType")?.value||"all";
  if(q) exits=exits.filter(x=>{const w=db.watches.find(y=>y.id===x.id);return [x.id,w?.title,w?.brand,w?.model,x.type,x.date].join(" ").toLowerCase().includes(q)});
  if(txType!=="all") exits=exits.filter(x=>x.type===txType);
  const body=document.getElementById("txExitBody");

  const count=document.getElementById("txResultCount");
  if(count) count.textContent=`${exits.length} result${exits.length===1?"":"s"}`;
}

function renderAnalytics(){
  const range=document.getElementById("analyticsRange")?.value||"lifetime";
  const start=rangeStart(range);
  const events=txRows().filter(x=>inRange(x.date,start));
  const sold=events.filter(x=>x.type==="SALE"), traded=events.filter(x=>x.type==="TRADE");
  const revenue=events.reduce((a,x)=>a+Number(x.amount||0),0);
  const cashIn=events.reduce((a,x)=>a+(x.type==="SALE"?Number(x.amount||0):0),0)+traded.reduce((a,x)=>{const w=db.watches.find(y=>y.id===x.id);return a+Number(w?.trade?.cash||0)},0);
  const nonCashTrade=traded.reduce((a,x)=>{const w=db.watches.find(y=>y.id===x.id);return a+Number(w?.trade?.allowance||0)},0);
  const cogs=events.reduce((a,x)=>{const w=db.watches.find(y=>y.id===x.id);return a+(w?costTo(w):0)},0);
  const opex=db.opex.filter(x=>inRange(x.date,start)).reduce((a,x)=>a+Number(x.amount||0),0);
  const other=db.otherCosts.filter(x=>inRange(x.date,start)).reduce((a,x)=>a+Number(x.amount||0),0);
  const capex=db.capex.filter(x=>inRange(x.date,start)).reduce((a,x)=>a+Number(x.cost||0),0);
  const gross=revenue-cogs,net=gross-opex-other;
  const av=db.watches.filter(w=>st(w)==="available");
  const invCost=av.reduce((a,w)=>a+costTo(w),0),asking=av.reduce((a,w)=>a+Number(w.asking||0),0),unrealized=asking-invCost,invRoi=invCost?unrealized/invCost*100:0;
  const openingFunds=Number(db.settings.openingFunds||0);
  const allEvents=txRows();
  const allSales=allEvents.filter(x=>x.type==="SALE"), allTrades=allEvents.filter(x=>x.type==="TRADE");
  const lifetimeCashIn=allSales.reduce((a,x)=>a+Number(x.amount||0),0)+allTrades.reduce((a,x)=>{const w=db.watches.find(y=>y.id===x.id);return a+Number(w?.trade?.cash||0)},0);

  // CASH BASIS: only money that actually left/entered the business affects Available Funds.
  // A BUY/acquisition base cost is a cash outflow. A TRADE/TRade-in base value is not: it is
  // an exchange of inventory. Additional costs (service, travel, authentication, bracelet,
  // etc.) are cash outflows. We deliberately exclude base cost rows here so a duplicated
  // Acquisition/Purchase row cannot be counted twice when costPrice is also present.
  const lifetimeWatchCashSpend=db.watches.reduce((total,w)=>{
    const source=String(w.source||'').trim().toLowerCase();
    const baseEntry=(w.costs||[]).find(c=>['purchase','acquisition','trade','trade-in'].includes(String(c.type||'').trim().toLowerCase()));
    const base=baseCostTo(w);
    const baseType=String(baseEntry?.type||'').trim().toLowerCase();
    const isTradeBase=source==='trade' || source==='trade-in' || baseType==='trade' || baseType==='trade-in';
    const baseCash=(!isTradeBase && base>0) ? base : 0;
    const extras=(w.costs||[]).reduce((sum,c)=>{
      const t=String(c.type||'').trim().toLowerCase();
      if(['purchase','acquisition','trade','trade-in'].includes(t)) return sum;
      return sum+costAmount(c);
    },0);
    return total+baseCash+extras;
  },0);
  const lifetimeOpex=db.opex.reduce((a,x)=>a+Number(x.amount||0),0), lifetimeOther=db.otherCosts.reduce((a,x)=>a+Number(x.amount||0),0), lifetimeCapex=db.capex.reduce((a,x)=>a+Number(x.cost||0),0);
  const fundingIn=db.funding.filter(x=>inRange(x.date,start)&&String(x.direction||'IN')==='IN').reduce((a,x)=>a+Number(x.amount||0),0);
  const fundingOut=db.funding.filter(x=>inRange(x.date,start)&&String(x.direction||'IN')==='OUT').reduce((a,x)=>a+Number(x.amount||0),0);
  const lifetimeFundingIn=db.funding.filter(x=>String(x.direction||'IN')==='IN').reduce((a,x)=>a+Number(x.amount||0),0);
  const lifetimeFundingOut=db.funding.filter(x=>String(x.direction||'IN')==='OUT').reduce((a,x)=>a+Number(x.amount||0),0);
  const lifetimeCashOut=lifetimeWatchCashSpend+lifetimeOpex+lifetimeOther+lifetimeCapex;
  const availableFunds=openingFunds+lifetimeFundingIn+lifetimeCashIn-lifetimeCashOut-lifetimeFundingOut;
  const currentFundingNet=lifetimeFundingIn-lifetimeFundingOut;
  const currentTied=invCost+capex;
  const totalRecordedDeployment=invCost+capex+opex+other;
  const spending=opex+other+capex;
  const rangeLabel=range==="lifetime"?"Lifetime":`Last ${range} days`;

  // Build the realized P/L chart from the actual event dates instead of the current year.
  // This keeps Lifetime analytics inclusive of every year in the transaction history.
  const chartDates=events.map(x=>String(x.date||'').slice(0,7)).filter(Boolean).sort();
  const chartKeys=[...new Set(chartDates)];
  const months=chartKeys.map(key=>{
    const [y,m]=key.split('-').map(Number);
    const d=new Date(y,m-1,1);
    return {key,label:`${d.toLocaleDateString('en-US',{month:'short'})} ${String(y).slice(-2)}`,year:y};
  });
  const monthVals=months.map(m=>events.filter(x=>String(x.date||'').slice(0,7)===m.key).reduce((a,x)=>a+Number(x.pl||0),0));
  const chartYearLabel=months.length
    ? ([...new Set(months.map(m=>m.year))].length>1
        ? `${months[0].year}–${months[months.length-1].year}`
        : String(months[0].year))
    : 'No exits';
  const maxVal=Math.max(1,...monthVals.map(v=>Math.abs(v))),avg=events.length?events.reduce((a,x)=>a+Number(x.pl||0),0)/events.length:0;
  document.getElementById("analytics").innerHTML=`<div class="pagehead"><div><h1>Analytics</h1><p>Financial performance, inventory position, and where business funds are deployed.</p></div><select id="analyticsRange" class="analytics-filter"><option value="lifetime" ${range==="lifetime"?'selected':''}>Lifetime</option><option value="30" ${range==="30"?'selected':''}>Last 30 days</option><option value="60" ${range==="60"?'selected':''}>Last 60 days</option><option value="90" ${range==="90"?'selected':''}>Last 90 days</option><option value="180" ${range==="180"?'selected':''}>Last 180 days</option><option value="365" ${range==="365"?'selected':''}>Last 365 days</option></select></div>
  <div class="analytics-finance"><div class="analytics-maincard"><div class="eyebrow">${rangeLabel} · NET PROFIT</div><div class="analytics-net ${net<0?'bad':''}">${money(net)}</div><div class="finance-line"><span>Revenue / Exit Value</span><b>${money(revenue)}</b></div><div class="finance-line"><span>COGS</span><b>${money(cogs)}</b></div><div class="finance-line"><span>Gross Profit</span><b class="${gross>=0?'good':'bad'}">${money(gross)}</b></div><div class="finance-line"><span>OPEX + Other</span><b>${money(opex+other)}</b></div></div><div class="analytics-sidecard"><div class="eyebrow">CURRENT INVENTORY</div><div class="inventory-big"><b>${av.length}</b><span>watches in stock</span></div><div class="finance-line"><span>Cost basis</span><b>${money(invCost)}</b></div><div class="finance-line"><span>Asking value</span><b>${money(asking)}</b></div><div class="finance-line"><span>Unrealized P/L</span><b class="${unrealized>=0?'good':'bad'}">${money(unrealized)}</b></div><div class="finance-line"><span>Inventory ROI</span><b>${invRoi.toFixed(1)}%</b></div></div></div>
  <div class="cashmap"><div class="cashcard dark"><div class="eyebrow">CURRENT · AVAILABLE FUNDS</div><div class="cashbig ${availableFunds<0?'bad':''}">${money(availableFunds)}</div><div class="cashrow"><span>Opening business funds</span><b>${money(openingFunds)}</b></div><div class="cashrow"><span>Funding in</span><b>${money(lifetimeFundingIn)}</b></div><div class="cashrow"><span>Cash received</span><b>${money(lifetimeCashIn)}</b></div><div class="cashrow"><span>Actual cash out</span><b>${money(lifetimeCashOut+lifetimeFundingOut)}</b></div></div><div class="cashcard"><h3>Where the capital is</h3><div class="deployment-grid"><div class="deployment-card"><small>Inventory at cost</small><b>${money(invCost)}</b></div><div class="deployment-card"><small>Business assets</small><b>${money(capex)}</b></div><div class="deployment-card"><small>OPEX + Other spent</small><b>${money(opex+other)}</b></div><div class="deployment-card"><small>Total recorded deployment</small><b>${money(totalRecordedDeployment)}</b></div></div><div class="deployment-grid" style="margin-top:10px"><div class="deployment-card"><small>Watch cash spent</small><b>${money(lifetimeWatchCashSpend)}</b></div><div class="deployment-card"><small>OPEX</small><b>${money(lifetimeOpex)}</b></div><div class="deployment-card"><small>Other</small><b>${money(lifetimeOther)}</b></div><div class="deployment-card"><small>CAPEX</small><b>${money(lifetimeCapex)}</b></div></div><div class="analytics-note">Available Funds is cash only. Trade allowances stay in inventory and do not reduce cash.</div></div></div>
  <div class="analytics-section"><div class="analytics-section-head"><h3>Realized P/L by month</h3><span>${chartYearLabel}</span></div><div class="analytics-chart" style="overflow-x:auto"><div class="chart-grid" style="grid-template-columns:repeat(${Math.max(1,months.length)},minmax(68px,1fr));min-width:${Math.max(1,months.length)*68}px">${months.map((m,i)=>{const v=monthVals[i],h=Math.max(4,Math.abs(v)/maxVal*82);return `<div class="chart-col"><div class="chart-bar ${v<0?'negative':''}" style="height:${h}%" title="${m.key}: ${money(v)}"></div><div class="chart-value">${v?money(v):''}</div><div class="chart-label">${m.label}</div></div>`}).join('')||'<div class="empty" style="grid-column:1/-1">No realized exits in this period.</div>'}</div></div></div>
  <div class="analytics-section analytics-ledger-wrap"><div class="analytics-section-head"><h3>Profit & spending</h3><span>${rangeLabel}</span></div><table class="table analytics-ledger"><thead><tr><th>Line item</th><th class="amount">Amount</th></tr></thead><tbody><tr><td>Revenue / Exit Value</td><td class="amount">${money(revenue)}</td></tr><tr><td>COGS</td><td class="amount">${money(cogs)}</td></tr><tr><td>Gross Profit</td><td class="amount ${gross>=0?'good':'bad'}">${money(gross)}</td></tr><tr><td>OPEX</td><td class="amount">${money(opex)}</td></tr><tr><td>Other</td><td class="amount">${money(other)}</td></tr><tr class="totalrow"><td><b>Net Profit</b></td><td class="amount"><b class="${net>=0?'good':'bad'}">${money(net)}</b></td></tr></tbody></table></div>

function csvEsc(v){const s=String(v??"");return '"'+s.replaceAll('"','""')+'"'}
function downloadFile(name,text,mime="text/csv"){
  try{
    const isCsv=mime.includes("text/csv");
    const payload=isCsv?"\uFEFF"+text:text;
    const href="data:"+mime+";charset=utf-8,"+encodeURIComponent(payload);
    const a=document.createElement("a");
    a.href=href;
    a.download=name;
    a.target="_blank";
    a.rel="noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(err){
    console.error(err);
    toast("Export failed. Try again.");
  }
}
function exportCsv(name,headers,rows){downloadFile(name,[headers,...rows].map(r=>r.map(csvEsc).join(",")).join("\n"))}

(function(){
  const _analytics=renderAnalytics, _transactions=renderTransactions, _reports=renderReports;
  const showViewError=(id,title,err)=>{const el=document.getElementById(id);if(el)el.innerHTML=`<div class="panel empty" style="margin-top:4px"><b>${esc(title)} couldn't load.</b><div style="margin-top:7px;color:var(--muted);font-size:12px">${esc(err?.message||String(err))}</div><button class="btn" style="margin-top:14px" data-action="retry-${id}">Retry</button></div>`};
  window.__tresRetry={analytics:()=>{try{_analytics()}catch(e){showViewError('analytics','Analytics',e)}},transactions:()=>{try{_transactions()}catch(e){showViewError('transactions','Transactions',e)}},reports:()=>{try{_reports()}catch(e){showViewError('reports','Reports',e)}}};
  renderAnalytics=()=>window.__tresRetry.analytics();
  renderTransactions=()=>window.__tresRetry.transactions();
  renderReports=()=>window.__tresRetry.reports();
})();

document.addEventListener("click",e=>{
  const sort=e.target.closest("[data-inv-sort]");
  if(sort){const key=sort.dataset.invSort;if(inventorySort.key===key)inventorySort.dir=inventorySort.dir==="desc"?"asc":"desc";else{inventorySort.key=key;inventorySort.dir=key==="purchase"?"desc":"asc"}inventoryPage=1;filterInventory();return;}
  const pageBtn=e.target.closest("[data-inv-page]");
  if(pageBtn){const pg=Number(pageBtn.dataset.invPage||1);if(pg>=1){inventoryPage=pg;filterInventory();}return;}
  const ts=e.target.closest("[data-table-sort]");
  if(ts){const key=ts.dataset.tableSort;const panel=ts.closest(".panel");const title=panel?.querySelector("h3")?.textContent?.trim();let state=txSort;if(title==="OPEX")state=opexSort;else if(title==="CAPEX")state=capexSort;else if(title==="Other")state=otherSort;if(state.key===key)state.dir=state.dir==="desc"?"asc":"desc";else{state.key=key;state.dir=key==="date"?"desc":"asc"}renderTransactions();return;}
  const nav=e.target.closest(".nav[data-view]");
  if(nav){
    current=nav.dataset.view;
    document.getElementById("app").classList.remove("mobile-open");
    document.querySelectorAll(".nav[data-view]").forEach(n=>n.classList.toggle("active",n===nav));
    render();
    return;
  }
  const explicit=e.target.closest("#tradeCompleteBtn");
  if(explicit){e.preventDefault();e.stopPropagation();completeTrade(explicit.dataset.id);return;}
  const rowAction=e.target.closest(".rowbtn[data-action]");
  if(rowAction){e.preventDefault();e.stopPropagation();}
  const a=e.target.closest("[data-action]");
  if(!a)return;
  const act=a.dataset.action,id=a.dataset.id;
  try{
    if(act==="retry-analytics"){window.__tresRetry?.analytics();return;}
    else if(act==="retry-transactions"){window.__tresRetry?.transactions();return;}
    else if(act==="retry-reports"){window.__tresRetry?.reports();return;}
    else if(act==="open-watch"){currentWatch=id;current="profile";render();}
    else if(act==="edit-opex")addOpexModal(Number(a.dataset.index));
    else if(act==="save-opex")saveOpex(a.dataset.index===""?null:Number(a.dataset.index));
    else if(act==="delete-opex")deleteOpex(Number(a.dataset.index));
    else if(act==="edit-capex")addCapexModal(Number(a.dataset.index));
    else if(act==="save-capex")saveCapex(a.dataset.index===""?null:Number(a.dataset.index));
    else if(act==="delete-capex")deleteCapex(Number(a.dataset.index));
    else if(act==="edit-other")addOtherModal(Number(a.dataset.index));
    else if(act==="save-other")saveOther(a.dataset.index===""?null:Number(a.dataset.index));
    else if(act==="delete-other")deleteOther(Number(a.dataset.index));
    else if(act==="view-opex")viewSpendModal("opex");
    else if(act==="view-capex")viewSpendModal("capex");
    else if(act==="view-other")viewSpendModal("other");
    else if(act==="add-funding")addFundingModal();
    else if(act==="view-funding")viewFundingModal();
    else if(act==="edit-funding")addFundingModal(Number(a.dataset.index));
    else if(act==="save-funding")saveFunding(a.dataset.index===""?null:Number(a.dataset.index));
    else if(act==="delete-funding")deleteFunding(Number(a.dataset.index));
    else if(act==="save-exit")saveExit(id,a.dataset.type);
    else if(act==="edit-exit")editExit(id,a.dataset.type);
    else if(act==="delete-exit")deleteExit(id,a.dataset.type);
    else if(act==="export-inventory")doExport("inventory");
    else if(act==="export-exits")doExport("exits");
    else if(act==="export-opex")doExport("opex");
    else if(act==="export-capex")doExport("capex");
    else if(act==="export-other")doExport("other");
    else if(act==="export-funding")doExport("funding");
    else if(act==="export-json")downloadFile("tres_backup.json",JSON.stringify(db,null,2),"application/json");
    else if(act==="set-opening-funds")setOpeningFundsModal();
    else if(act==="save-opening-funds")saveOpeningFunds();
    else if(act==="export-all"){["inventory","exits","opex","capex","other","funding"].forEach((k,i)=>setTimeout(()=>doExport(k),i*140));setTimeout(()=>downloadFile("tres_backup.json",JSON.stringify(db,null,2),"application/json"),900);}
    else if(act==="go-inventory"){current="inventory";render();}
    else if(act==="back-inventory"){current="inventory";render();}
    else if(act==="close")closeModal();
    else if(act==="add-watch")addWatchModal();
    else if(act==="edit-watch")editWatchModal(id);
    else if(act==="delete-watch")deleteWatch(id);
    else if(act==="save-edit")saveEdit(id);
    else if(act==="add-cost")addCostModal(id);else if(act==="edit-cost")editCostModal(id,Number(a.dataset.index));else if(act==="save-cost")saveCost(id,Number(a.dataset.index));else if(act==="delete-cost")deleteCost(id,Number(a.dataset.index));
    else if(act==="sell-watch")saleModal(id);
    else if(act==="complete-sale")completeSale(id);
    else if(act==="trade-watch")tradeModal(id);
    else if(act==="complete-trade")completeTrade(id);
    else if(act==="return-watch")returnInventory(id);
    else if(act==="create-watch")createWatch();
    else if(act==="create-cost")createCost();
    else if(act==="add-opex")addOpexModal();
    else if(act==="create-opex")createOpex();
    else if(act==="add-capex")addCapexModal();
    else if(act==="create-capex")createCapex();
    else if(act==="add-other")addOtherModal();
    else if(act==="create-other")createOther();
  }catch(err){console.error(err);toast("TRES hit an error. Refresh the page and try again.")}
});
document.addEventListener("input",e=>{
  if(e.target.id.startsWith("f_aw_") && e.target.type!=="file") rememberField(e.target.id.slice(2),e.target.value);
  if(e.target.id==="homeSearch"){
    const box=document.getElementById("homeResults");
    if(box) box.innerHTML=search(e.target.value).filter(w=>st(w)==="available").map(card).join("")||'<div class="panel empty" style="grid-column:1/-1">No watches found.</div>';
  }
  if(e.target.id==="invSearch"){inventoryPage=1;filterInventory();}
  if(e.target.id==="txSearch")filterTransactions();
});
document.addEventListener("change",e=>{
  if(e.target.id==="invStatus"||e.target.id==="invBrand"){inventoryPage=1;filterInventory();}
  if(e.target.id==="txType")renderTransactions();
  if(e.target.id==="analyticsRange")renderAnalytics();
});

window.addEventListener("error",e=>{console.error(e.error||e.message);if(typeof toast==="function")toast("TRES hit an error. Check the browser console.");});
document.getElementById("mobileMenu").addEventListener("click",()=>{const app=document.getElementById("app");const open=app.classList.toggle("mobile-open");document.getElementById("mobileMenu").setAttribute("aria-expanded",String(open));});
document.getElementById("mobileClose")?.addEventListener("click",()=>document.getElementById("app").classList.remove("mobile-open"));
document.getElementById("mobileOverlay").addEventListener("click",()=>document.getElementById("app").classList.remove("mobile-open"));

document.getElementById("brandToggle").addEventListener("click",()=>{const app=document.getElementById("app");app.classList.toggle("collapsed");});
async function boot(){
  try{
    if(supabaseClient){
      const {data,error}=await supabaseClient.from("app_state").select("data").eq("id","tres").maybeSingle();
      if(error)throw error;
      if(data?.data) db=normalizeDb(data.data);
      else {
        try{db=normalizeDb(JSON.parse(localStorage.getItem("tres_house_v2")||""))}catch(_){db=normalizeDb({watches:[],opex:[],capex:[],otherCosts:[],funding:[],settings:{openingFunds:0}})}
        await save();
      }
    }else{
      try{db=normalizeDb(JSON.parse(localStorage.getItem("tres_house_v2")||""))}catch(_){db=normalizeDb({watches:[],opex:[],capex:[],otherCosts:[],funding:[],settings:{openingFunds:0}})}
    }
  }catch(e){
    console.error("TRES boot failed",e);
    try{db=normalizeDb(JSON.parse(localStorage.getItem("tres_house_v2")||""))}catch(_){}
    toast("Could not sync with database. Using local data.");
  }
  render();
}
boot();

(function installAutoAskingObserver(){
  const bind = ()=>{
    document.querySelectorAll('form').forEach(form=>{
      if(form.querySelector('[name="asking"], [name="askingPrice"], #askingPrice')){
        bindAutoAskingPrice(form);
      }
    });
  };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
  new MutationObserver(bind).observe(document.body,{childList:true,subtree:true});
})();

<div id="tresSaveOverlay" aria-live="polite" aria-busy="true">
  <div id="tresSaveCard">
    <div id="tresSaveSpinner"></div>
    <div id="tresSaveTitle">Saving to TRES…</div>
    <div id="tresSaveMessage">Uploading your changes to the database</div>
    <div id="tresSaveTrack"><div id="tresSaveBar"></div></div>
  </div>
</div>

<script id="tres-save-loading-js">
let tresSaveLoadingCount = 0;
function showTresSaveLoading(message="Uploading your changes to the database"){
  tresSaveLoadingCount++;
  const el=document.getElementById("tresSaveOverlay");
  const msg=document.getElementById("tresSaveMessage");
  if(msg) msg.textContent=message;
  if(el) el.classList.add("show");
  document.body.classList.add("tres-saving");
}
function hideTresSaveLoading(){
  tresSaveLoadingCount=Math.max(0,tresSaveLoadingCount-1);
  if(tresSaveLoadingCount) return;
  const el=document.getElementById("tresSaveOverlay");
  if(el) el.classList.remove("show");
  document.body.classList.remove("tres-saving");
}
</script>
